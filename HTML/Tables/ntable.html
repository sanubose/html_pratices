<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
    td {
        color: green;
    }
    th {
        color: red;
    }
</style>
</head>
<body>
    <table border="2">
        <caption> its my table </caption>
        <colgroup>
            <col span="1" style="background-color: aqua;"/>
            <col span="3" style="background-color: beige;">
            <col span=" 3" style="color: rgb(6, 6, 31);">
        </colgroup>

    
    <thead>
         <tr>
        <th>col-1</th>
        <th>col-2</th>
        <th>col-3</th>
        <th>col-4</th>
       </tr>

    </thead>
     <tbody>
         <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
            <td>9</td>
            <td>10</td>
            <td>11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>
        </tr>
        <tfoot>
            <tr>
                <td>abc</td>
                <td>efg</td>
                <td>ijk</td>
                <td>xyz</td>
            </tr>
        </tfoot>
     </tbody>
       
    </table>
</body>
</html>
