<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Question</title>
</head>
<body>
    <center>
    <h2>GoGreen</h2><br><br>

    <form action="dummy.html">

        <div>
            <label for="name">Full Name:</label>
            <input type="text" placeholder="Enter Your FullName" id="name" required maxlength="50">
        </div><br><br>

        <div>
            <label for="email">Email ID:</label>
            <input type="email" placeholder="Enter Your email" id="email"  value="user@example.com" readonly  required>
        </div><br><br>

        <div>
            <label for="Pn">Phone Number:</label>
            <input type="tel" placeholder="Enter Your ten digit Phone Num" id="Pn" required pattern="[0-9]{10}">
        </div><br><br>


        <div>
            <label for="pass">Password</label>
            <input type="password" placeholder="Enter Your password" id="pass" required pattern="(?=.*[a-z]) (?=.*[A-Z] (?=.*[0-9)) (?=.*[!@#$%^&*-_+=]).{8,} ">
        </div><br><br>

        <div>
            <label for="age">Age</label>
        <input type="number" id="age" min="18" max="60" required>

        </div><br><br>
        
        <!---pattern (MH12AB1234) in this first place "MH" second"12"2digit third place "1234" -->
        <div>
             <label for="reg">Vechicle Reg NO.</label>
        <input type="text" id="reg" pattern="[A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{4}" required>
        </div><br><br>

        <div>
            <label for="city">City</label>
        <select  id="city">
            <option value="select">Select</option>
            <option value="Dehli">Dehli</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Bangalore">Bangalore</option>
        </select>
        

        </div><br><br>

        <div>
            <label for="checkbox">Term & Conditions</label>
            <input type="checkbox" id="checkbox">
        </div><br><br>
        
        <div>
         <button>Submit</button>

        </div>
        <br><br>

    </form>
  </center>
    
</body>
</html>
