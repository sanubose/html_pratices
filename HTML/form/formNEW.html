<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Forms in html</h2>
    <form action="dummy.html">
    <label for="first">First Name :</label>
     <input type="text" minlength="5" maxlength="7" id="first" required><br><br>

      <label for="last">Last Name :</label>
     <input type="text" minlength="5" maxlength="7" id="last" required><br><br>

      <label for="age">Age :</label>
     <input type="number" id="age" required><br><br>

      <label for="email">Email :</label>
     <input type="emai" id="email" required><br><br>

      <label for="date">Date :</label>
     <input type="date" id="date" required><br><br>

      <label for="pass">Password :</label>
     <input type="pass" id="pass" required><br><br>

      <label for="" name="gen">Gender</label>
     <input type="radio" name="gen" value="Male" required>Male
     <input type="radio" name="gen" value="Female" required >Female
     <input type="radio" name="gen" value="Others" required>Others
     <br><br>
     
<label>Region :</label>

<input type="checkbox" id="urban" name="region" value="urban">
<label for="urban">Urban</label>

<input type="checkbox" id="rural" name="region" value="rural">
<label for="rural">Rural</label>

<input type="checkbox" id="pwd" name="region" value="pwd">
<label for="pwd">PWD</label>

<br><br>


     <label for="clr">Your Favourite Color:</label>
     <input type="color" required><br><br>

     <label for="fee">Payment :</label>
     <select name="Payment" id="fee">
        <option value="Select">Select</option>
        <option value="GooglePAy">GooglePAy</option>
         <option value="COD">COD</option>
          <option value="UPI">UPI</option>
           <option value="PhonePay">PhonePay</option>
     </select><br><br>

     <label for="fead" >Feadback :</label> <br>
     <textarea name="Feadback" id="fead" cols="25"  rows="5" required> </textarea>
       
     <button type="reset">Reset</button>
     <button type="reset">Submit</button>







    </form>
</body>
</html>
