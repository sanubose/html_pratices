<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>learning Form!</h1>
    <form action="dummy.html">

        
        <div>
             <label for="photo">Image</label>   
          <input type="file"  id="photo" accept=".jpg,.Jpeg,.png"> 
        </div><br>

        <div>
             <label for="Name">Name:</label>   
          <input type="text" placeholder="Enter Your Name" id="Name" required> 
       
        </div><br>
      <div>
        <label for="Password">Password</label> 
        <input  type="password" placeholder="Enter Your placeholder" id="Password" minlength="5" maxlength="8" required>
      </div><br>
       
      <div>
             <label for="email">Email</label>   
         <input type="email" placeholder="Enter Your Email" id="email" required> 
       
        </div><br>

        <div>
             <label for="date">Date</label>   
            <input type="date" placeholder="Select Your date" id="date" required> 
       
        </div><br>

        <div>
             <label for="age">Age</label>   
             <input type="number" placeholder="Enter Your Age" id="age" required> 
       
        </div><br>

        <div>
              <label for="">Gender :</label>
              Male<input type="radio" name="Gender" value="Male">
              Female<input type="radio" name="Gender" value="Female">
              Others <input type="radio" name="Gender" value="Others">
        </div><br>

        <div>
             <label for="Tc">Terms & Conditions</label>   
            <input type="checkbox" id="Tc" required checked> 
       
        </div><br>

        <div>
              
         <textarea placeholder="Feadback....." cols="30" rows="7"></textarea>
       
        </div><br>
         <div>
             <label for="">Job</label>
         <select> 
           <option value="TATA">TATA</option>
           <option value="GENESIS">GENESIS</option>
           <option value="JIO">JIO</option>
           <option value="NETFLIX">NETFLIX</option>            
         </select><br>
         </div><br>

        

         <div>
             <label for="cv">RESUME:</label>   
          <input type="file"  id="cv" accept=".pdf"> 
       
        </div><br>

        
         <div>
             <label for="test">Defficulty</label>   
          <input type="range"  id="test"> 
       
        </div><br>
        
             
        <br>

        <button type="reset">reset</button>
       <button type="submit">Submit</button>
    </form>

</body>
</html>
